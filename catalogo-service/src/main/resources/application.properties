spring.application.name=catalogo-service
server.port=${PORT:8082}

# MongoDB (replica set rs0). Fuente de verdad del servicio.
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/?replicaSet=rs0&directConnection=true}
spring.mongodb.database=catalogo_db
spring.data.mongodb.auto-index-creation=true

# Redis (base logica propia del servicio)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=1
spring.data.redis.timeout=2s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

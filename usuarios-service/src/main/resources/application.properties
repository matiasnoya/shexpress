spring.application.name=usuarios-service
server.port=${PORT:8081}

# MongoDB (replica set rs0). Fuente de verdad del servicio.
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/?replicaSet=rs0&directConnection=true}
spring.mongodb.database=usuarios_db
spring.data.mongodb.auto-index-creation=true

# Redis (base logica propia del servicio)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0
spring.data.redis.timeout=2s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Mongo: campos en snake_case (igual que los JSON del enunciado) y BigDecimal como Decimal128
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
spring.data.mongodb.representation.big-decimal=decimal128

# API JSON en snake_case y errores con formato RFC 9457 (ProblemDetail)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true

# Cache de lectura y exportacion seudonimizada
shopexpress.cache.ttl-usuario=60s
shopexpress.export.salt=${EXPORT_SALT:cambiar-en-produccion}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true

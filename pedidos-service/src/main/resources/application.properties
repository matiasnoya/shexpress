spring.application.name=pedidos-service
server.port=${PORT:8083}

# MongoDB (replica set rs0). Fuente de verdad del servicio.
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/?replicaSet=rs0&directConnection=true}
spring.mongodb.database=pedidos_db
spring.data.mongodb.auto-index-creation=true

# Redis (base logica propia del servicio)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=2
spring.data.redis.timeout=2s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# URLs de los servicios que orquesta la SAGA
shopexpress.usuarios.url=${USUARIOS_URL:http://localhost:8081}
shopexpress.catalogo.url=${CATALOGO_URL:http://localhost:8082}
shopexpress.simular-fallo-historial=${SIMULAR_FALLO_HISTORIAL:false}
shopexpress.http.timeout-conexion=2s
shopexpress.http.timeout-lectura=5s
shopexpress.pago.limite=10000
shopexpress.idempotencia.ttl=24h

# Mongo: campos en snake_case (igual que el JSON de pedido del enunciado) y BigDecimal como Decimal128
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
spring.data.mongodb.representation.big-decimal=decimal128

# API JSON en snake_case y errores con formato RFC 9457 (ProblemDetail)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true
shopexpress.compensaciones.reintento=${REINTENTO_COMPENSACIONES:30s}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true

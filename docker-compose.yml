name: shopexpress

x-mongo-node: &mongo-node
  image: mongo:8.0
  command: ["--replSet", "rs0", "--bind_ip_all"]
  restart: unless-stopped

x-service-env: &service-env
  MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
  REDIS_HOST: redis
  REDIS_PORT: "6379"

services:
  # ---------- Infraestructura ----------
  mongo2:
    <<: *mongo-node
    volumes: [mongo2-data:/data/db]

  mongo3:
    <<: *mongo-node
    volumes: [mongo3-data:/data/db]

  mongo1:
    <<: *mongo-node
    ports: ["27017:27017"]          # acceso desde el host (Compass / ejecución local)
    volumes: [mongo1-data:/data/db]
    depends_on: [mongo2, mongo3]
    # Inicializa el replica set una sola vez y queda "healthy" cuando hay primario.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >
          try { rs.status() } catch (e) {
            rs.initiate({_id: 'rs0', members: [
              {_id: 0, host: 'mongo1:27017', priority: 2},
              {_id: 1, host: 'mongo2:27017', priority: 1},
              {_id: 2, host: 'mongo3:27017', priority: 1}
            ]})
          };
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ---------- Microservicios ----------
  usuarios-service:
    build: ./usuarios-service
    ports: ["8081:8081"]
    environment:
      <<: *service-env
      PORT: "8081"
    depends_on:
      mongo1: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: &app-health
      test: ["CMD-SHELL", "curl -fs http://localhost:$${PORT}/actuator/health || exit 1"]
      interval: 10s
      retries: 12
      start_period: 20s

  catalogo-service:
    build: ./catalogo-service
    ports: ["8082:8082"]
    environment:
      <<: *service-env
      PORT: "8082"
    depends_on:
      mongo1: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: *app-health

  pedidos-service:
    build: ./pedidos-service
    ports: ["8083:8083"]
    environment:
      <<: *service-env
      PORT: "8083"
      USUARIOS_URL: http://usuarios-service:8081
      CATALOGO_URL: http://catalogo-service:8082
      SIMULAR_FALLO_HISTORIAL: "false"
    depends_on:
      usuarios-service: { condition: service_healthy }
      catalogo-service: { condition: service_healthy }
    healthcheck: *app-health

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
